<!DOCTYPE html>
<html>
<head>
    <title>Music Playlist Manager</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            text-align: center;
            padding: 20px;
        }

        .player {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            color: #333;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            cursor: pointer;
        }

        #seekSlider {
            width: 100%;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            margin: 5px;
            background: #e0e0e0;
            cursor: pointer;
            border-radius: 5px;
        }

        li:hover {
            background: #d0d0d0;
        }

        .time {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="player">
    <h2>Music Playlist Manager</h2>

    <h3 id="songTitle">Select a Song</h3>

    <audio id="audioPlayer"></audio>

    <button onclick="prevSong()">⏮ Previous</button>
    <button onclick="playPause()">▶ Play / ⏸ Pause</button>
    <button onclick="nextSong()">⏭ Next</button>

    <br><br>

    <input type="range" id="seekSlider" value="0">

    <div class="time">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
    </div>

    <h3>Playlist</h3>

    <ul id="playlist">
        <li onclick="loadSong(0)">Song 1</li>
        <li onclick="loadSong(1)">Song 2</li>
        <li onclick="loadSong(2)">Song 3</li>
    </ul>
</div>

<script>
const songs = [
{
    title: "Song 1",
    src: "song1.mp3"
},
{
    title: "Song 2",
    src: "song2.mp3"
},
{
    title: "Song 3",
    src: "song3.mp3"
}
];

let currentSong = 0;

const audio = document.getElementById("audioPlayer");
const title = document.getElementById("songTitle");
const seekSlider = document.getElementById("seekSlider");
const currentTimeText = document.getElementById("currentTime");
const durationText = document.getElementById("duration");

function loadSong(index) {
    currentSong = index;
    audio.src = songs[index].src;
    title.textContent = songs[index].title;
    audio.load();
    audio.play();
}

function playPause() {
    if (audio.paused) {
        audio.play();
    } else {
        audio.pause();
    }
}

function nextSong() {
    currentSong = (currentSong + 1) % songs.length;
    loadSong(currentSong);
}

function prevSong() {
    currentSong = (currentSong - 1 + songs.length) % songs.length;
    loadSong(currentSong);
}

audio.addEventListener("loadedmetadata", () => {
    seekSlider.max = audio.duration;
    durationText.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
    seekSlider.value = audio.currentTime;
    currentTimeText.textContent = formatTime(audio.currentTime);
});

seekSlider.addEventListener("input", () => {
    audio.currentTime = seekSlider.value;
});

audio.addEventListener("ended", () => {
    nextSong();
});

function formatTime(seconds) {
    let mins = Math.floor(seconds / 60);
    let secs = Math.floor(seconds % 60);
    if (secs < 10) secs = "0" + secs;
    return mins + ":" + secs;
}
</script>

</body>
</html>
